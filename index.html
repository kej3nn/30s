<title>한 사람의 하루</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 서울남산체: font/ 폴더의 TTF를 그대로 지정 (파일마다 굵기값이 400이라 굵기를 직접 지정) */
  @font-face {
    font-family: 'SeoulNamsan';
    src: url('font/SeoulNamsanL.ttf') format('truetype');
    font-weight: 300;
    font-display: block;
  }
  @font-face {
    font-family: 'SeoulNamsan';
    src: url('font/SeoulNamsanM.ttf') format('truetype');
    font-weight: 500;
    font-display: block;
  }

  /* 레이아웃: 검정 무대 위에 문구 한 덩어리를 가운데 두고, 버튼은 그 아래. 영상은 화면 전체를 덮는다. */
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --muted: #bdbdbd;
    --btn-bg: #1a1a1a;
    --btn-bg-hover: #2e2e2e;
    --btn-bg-active: #252525;
    --btn-line: #3a3a3a;
    --btn-line-hover: #5a5a5a;
    --ring: #ffffff;
    --font: 'SeoulNamsan', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --fs: clamp(18px, min(2.5vw, 4.4vh), 48px);
    --ease-up: cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme: dark;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  #stage { position: relative; height: 100%; }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity var(--fade, 800ms) ease, visibility 0s linear var(--fade, 800ms);
  }
  .screen.on {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity var(--fade, 800ms) ease, visibility 0s linear 0s;
  }

  .group {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .block {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: calc(var(--fs) * 1.67);
  }
  .block p {
    margin: 0;
    line-height: 1.6;
    word-break: keep-all;
    text-wrap: balance;
  }

  .main, .line {
    font-size: var(--fs);
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .block .sub {
    font-size: max(13px, calc(var(--fs) * 0.583));
    font-weight: 300;
    letter-spacing: 0.03em;
    margin-top: calc(var(--fs) * 1.6);
  }
  .block .line-last { margin-top: calc(var(--fs) * 1.6); }

  /* 문구가 한 행씩 아래에서 올라오며 나타남 */
  .line {
    opacity: 0;
    transform: translateY(0.62em);
    animation: up 1200ms var(--ease-up) var(--delay, 0ms) forwards paused;
  }
  #s2.play .line { animation-play-state: running; }
  @keyframes up {
    from { opacity: 0; transform: translateY(0.62em); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes only-fade { from { opacity: 0; } to { opacity: 1; } }

  .btn {
    font: inherit;
    font-size: max(14px, calc(var(--fs) * 0.5));
    font-weight: 500;
    line-height: 1.2;
    color: var(--fg);
    background: var(--btn-bg);
    border: 1px solid var(--btn-line);
    border-radius: 4px;
    padding: 0.75em 2.33em;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
    transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease,
                opacity var(--fade, 500ms) ease, visibility 0s linear 0s;
  }
  .btn:hover, .btn:focus-visible {
    background: var(--btn-bg-hover);
    border-color: var(--btn-line-hover);
    box-shadow: 0 0 0 2px var(--ring);
    outline: none;
  }
  .btn:active { background: var(--btn-bg-active); }
  .btn:disabled, .btn:disabled:hover {
    background: var(--btn-bg);
    border-color: var(--btn-line);
    box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
    pointer-events: none;
    cursor: default;
  }
  .btn.off {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity var(--fade, 500ms) ease, visibility 0s linear var(--fade, 500ms);
  }

  .msg {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin: 1.2em 0 0;
    font-size: max(12px, calc(var(--fs) * 0.42));
    color: var(--muted);
    white-space: nowrap;
  }
  .msg:empty { display: none; }

  /* 빨간 파형: 화면 전체 (소리 나는 동안만) */
  #s0 { position: fixed; inset: 0; z-index: 1; background: #120000; pointer-events: none; }
  #s0 canvas { display: block; width: 100%; height: 100%; }

  /* 영상: 화면 전체, 비율 유지 */
  #s3 { position: fixed; inset: 0; z-index: 2; background: var(--bg); }
  #s3 video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--bg); }

  @media (prefers-reduced-motion: reduce) {
    .line { transform: none; animation-name: only-fade; }
  }
</style>

<main id="stage">

  <section id="s1" class="screen" aria-label="인트로">
    <div class="group">
      <div class="block">
        <p class="main">잠시 후, 당신은</p>
        <p class="main">한 사람의 하루로 들어갑니다</p>
        <p class="sub">소리에 집중하기 위해, 눈을 감아주세요.</p>
      </div>
      <button id="start" class="btn" type="button" disabled>시작하기</button>
      <p id="msg1" class="msg" role="status"></p>
    </div>
  </section>

  <section id="s0" class="screen" aria-hidden="true"><canvas id="wave"></canvas></section>

  <section id="s2" class="screen" aria-label="중간 화면">
    <div class="group">
      <div class="block">
        <p class="line">혼란스럽고</p>
        <p class="line">영육간에 생각처럼 잘 안되고</p>
        <p class="line">가끔은 주저앉고 싶은 나에게</p>
        <p class="line line-last">하나님의 도움을 받고 싶다면?</p>
      </div>
      <button id="next" class="btn off" type="button" disabled>다음으로</button>
      <p id="msg2" class="msg" role="status"></p>
    </div>
  </section>

  <section id="s3" class="screen" aria-label="영상">
    <video id="video" src="https://lqsft7geiuafjg9m.public.blob.vercel-storage.com/good_words.mp4" preload="metadata" playsinline></video>
  </section>

</main>

<audio id="audio" src="https://lqsft7geiuafjg9m.public.blob.vercel-storage.com/bad_words.mp3" preload="auto"></audio>
<audio id="eyes" src="https://lqsft7geiuafjg9m.public.blob.vercel-storage.com/open_eyes.mp3" preload="auto"></audio>

<script>
  (() => {
    // 타이밍 (ms)
    const T = { pageIn: 800, startOut: 500, introOut: 1000, delays: [500, 2000, 3500, 5800],
                lineDur: 1200, nextWait: 500, nextIn: 800, midOut: 800, vidIn: 800, vidOut: 1000 };

    const $ = (id) => document.getElementById(id);
    const s1 = $('s1'), s2 = $('s2'), s3 = $('s3');
    const start = $('start'), next = $('next');
    const msg1 = $('msg1'), msg2 = $('msg2');
    const audio = $('audio'), eyes = $('eyes'), video = $('video');
    const lines = [...s2.querySelectorAll('.line')];

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const show = (el, ms) => { el.style.setProperty('--fade', ms + 'ms'); el.classList.add('on'); };
    const hide = (el, ms) => { el.style.setProperty('--fade', ms + 'ms'); el.classList.remove('on'); return wait(ms); };
    const btnShow = (b, ms) => { b.style.setProperty('--fade', ms + 'ms'); b.classList.remove('off'); };
    const btnHide = (b, ms) => { b.style.setProperty('--fade', ms + 'ms'); b.classList.add('off'); };

    lines.forEach((el, i) => el.style.setProperty('--delay', T.delays[i] + 'ms'));

    let state = 'loading';

    // 폰트가 준비되면 첫 화면 표시 (최대 3초 대기)
    const fontsReady = document.fonts
      ? Promise.all(['500 1em SeoulNamsan', '300 1em SeoulNamsan'].map((f) => document.fonts.load(f).catch(() => {})))
          .then(() => document.fonts.ready)
      : Promise.resolve();
    Promise.race([fontsReady, wait(3000)]).then(() => {
      state = 'intro';
      start.disabled = false;
      show(s1, T.pageIn);
    });

    // ── 빨간 파형 (Web Audio AnalyserNode → canvas) ──
    const s0 = $('s0'), cv = $('wave'), g = cv.getContext('2d');
    let actx, an, td, fd, raf = 0, dpr = 1, W = 0, H = 0;
    const size = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    window.addEventListener('resize', size);

    const parts = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(),
      vx: (Math.random() - 0.5) * 0.01, vy: (Math.random() - 0.5) * 0.008, r: Math.random() * 1.6 + 0.4, a: Math.random() * 0.35 + 0.1 }));
    const rings = [];
    let lv = 0, bass = 0, prevBass = 0, lastRing = 0, t0 = 0, last = 0;

    function draw(now) {
      raf = requestAnimationFrame(draw);
      const t = (now - t0) / 1000, dt = Math.min((now - last) / 1000, 0.05); last = now;
      // 소리 크기를 아주 느리게만 반영 (파형과 일치할 필요 없음 → 잔잔한 숨쉬기 느낌)
      let target = 0.5 + 0.2 * Math.sin(t * 1.1);
      if (an) {
        an.getByteTimeDomainData(td);
        let sum = 0; for (let i = 0; i < td.length; i++) { const v = (td[i] - 128) / 128; sum += v * v; }
        target = 0.35 + Math.min(0.5, Math.sqrt(sum / td.length) * 2);
      }
      lv += (target - lv) * 0.03;

      g.fillStyle = '#120000'; g.fillRect(0, 0, W, H);
      const cy = H * 0.535;
      const gr = g.createRadialGradient(W / 2, cy, H * 0.1, W / 2, cy, Math.max(W, H) * 0.7);
      gr.addColorStop(0, `rgba(90,8,4,${0.22 + lv * 0.12})`); gr.addColorStop(1, 'rgba(0,0,0,0.55)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);

      // 입자: 아주 천천히 떠다님
      for (const p of parts) {
        p.x = (p.x + p.vx * dt * 1.5 + 1) % 1; p.y = (p.y + p.vy * dt * 1.5 + 1) % 1;
        g.fillStyle = `rgba(200,40,24,${p.a * 0.6})`;
        g.beginPath(); g.arc(p.x * W, p.y * H, p.r, 0, 6.283); g.fill();
      }

      // 동심원: 선 위 한 점에서 작고 촘촘하게 퍼졌다 사라짐
      if (now - lastRing > 1100) { lastRing = now; rings.push({ x: W * (0.15 + 0.7 * Math.random()), r: 3, a: 0.7 }); }
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i]; r.r += dt * H * 0.05; r.a -= dt * 0.55;
        if (r.a <= 0) { rings.splice(i, 1); continue; }
        for (let k = 0; k < 3; k++) {
          const rr = r.r - k * 5; if (rr <= 0) continue;
          g.strokeStyle = `rgba(210,30,35,${r.a * (1 - k * 0.3)})`; g.lineWidth = 1;
          g.beginPath(); g.arc(r.x, cy, rr, 0, 6.283); g.stroke();
        }
      }

      // 지지직: 선이 평평하다가 군데군데 잔떨림이 일어남 (진폭은 작게, 위치는 천천히 이동)
      g.lineJoin = 'round';
      for (let k = 0; k < 3; k++) {
        g.beginPath();
        const base = H * 0.011 * (0.7 + lv);
        const c1 = 0.5 + 0.38 * Math.sin(t * 0.45 + k * 1.7), c2 = 0.5 + 0.38 * Math.sin(t * 0.31 + 2 + k);
        for (let x = 0; x <= W; x += 3) {
          const nx = x / W;
          const burst = Math.exp(-Math.pow((nx - c1) / 0.12, 2)) + 0.7 * Math.exp(-Math.pow((nx - c2) / 0.09, 2)) + 0.12;
          const j = Math.sin(nx * 70 + t * (17 + k * 5) + k) * 0.55 + Math.sin(nx * 150 - t * (23 + k * 4)) * 0.3 + Math.sin(nx * 37 + t * 9) * 0.4;
          const y = cy + base * burst * j;
          x ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.strokeStyle = `rgba(255,${85 + k * 12},${40 + k * 8},${0.55 - k * 0.12})`;
        g.lineWidth = 1; g.stroke();
      }
      // 중앙 가는 선: 빛이 천천히 숨쉬듯 번짐
      g.save(); g.shadowColor = 'rgba(255,90,40,0.8)'; g.shadowBlur = 8 + lv * 6;
      g.strokeStyle = 'rgba(255,120,60,0.9)'; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(0, cy); g.lineTo(W, cy); g.stroke(); g.restore();
    }

    function waveStart() {
      size(); rings.length = 0; lv = bass = prevBass = 0;
      t0 = last = performance.now();
      cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
    }
    function waveStop() { cancelAnimationFrame(raf); raf = 0; }

    // 시작하기 → 소리(bad_words) 재생 + 빨간 파형. 소리만 나오고 영상은 쓰지 않음
    start.addEventListener('click', () => {
      if (state !== 'intro') return;
      state = 'audio';
      td = new Uint8Array(1024); fd = new Uint8Array(512);
      // file:// 로 열면 브라우저가 소리를 분석기로 보내는 순간 무음 처리함 → 그땐 분석기를 쓰지 않고 소리는 그대로 재생
      if (false) {   // 분석기 연결 안 함: 외부(Blob) 주소 소리가 무음 처리되는 것을 방지
        try {
          if (!actx) {
            actx = new (window.AudioContext || window.webkitAudioContext)();
            an = actx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.6;
            actx.createMediaElementSource(audio).connect(an); an.connect(actx.destination);
          }
          actx.resume();
        } catch (e) { an = null; }
      }
      if (audio.error) audio.load();
      const p = audio.play();                 // 클릭 안에서 바로 호출
      start.disabled = true;
      msg1.textContent = '';
      eyes.muted = true;                      // 클릭 안에서 잠깐 재생했다 멈춰 두면 나중에 자동 재생이 막히지 않음
      const pr = eyes.play();
      if (pr && pr.then) pr.then(() => { eyes.pause(); eyes.currentTime = 0; eyes.muted = false; }).catch(() => { eyes.muted = false; });
      video.preload = 'auto';                 // 영상도 미리 받기
      const fail = () => {
        state = 'intro'; waveStop();
        hide(s0, 300); show(s1, 300);
        msg1.textContent = '음성을 재생하지 못했습니다. 다시 시도해주세요.';
        start.disabled = false; btnShow(start, 300);
      };
      if (p && p.then) p.then(() => {
        if (state !== 'audio') return;
        s0.style.display = ''; waveStart(); show(s0, 800);
        hide(s1, 600);
      }).catch(fail);
    });

    // bad_words 끝 → 파형을 완전히 지운 뒤 open_eyes 재생 (재생되는 동안은 검정 화면만)
    audio.addEventListener('ended', async () => {
      if (state !== 'audio') return;
      state = 'eyes';
      await hide(s0, 700);
      waveStop();
      s0.style.display = 'none';              // 파형 화면 완전히 제거
      if (state !== 'eyes') return;
      const p = eyes.play();
      if (p && p.catch) p.catch(goMiddle);    // 재생 실패 시 건너뛰고 다음 화면으로
    });

    // open_eyes 끝 → 문구 4행이 차례로 올라옴 → 다음으로 버튼
    eyes.addEventListener('ended', () => { if (state === 'eyes') goMiddle(); });
    eyes.addEventListener('error', () => { if (state === 'eyes') goMiddle(); });

    async function goMiddle() {
      if (state !== 'eyes') return;
      state = 'middle';
      await wait(500);
      show(s2, 0);
      s2.classList.add('play');
      await wait(T.delays[3] + T.lineDur + T.nextWait);
      btnShow(next, T.nextIn);
      await wait(T.nextIn);
      next.disabled = false;
      state = 'ready';
    }

    // 다음으로 → 영상 바로 재생
    next.addEventListener('click', () => {
      if (state !== 'ready') return;
      state = 'video';
      if (video.error) video.load();
      const p = video.play();               // 클릭 안에서 바로 호출
      next.disabled = true;
      msg2.textContent = '';
      hide(s2, T.midOut);
      show(s3, T.vidIn);
      if (p && p.catch) p.catch(() => {
        state = 'ready';
        video.pause();
        hide(s3, 300);
        show(s2, 300);
        msg2.textContent = '영상을 재생하지 못했습니다. 다시 시도해주세요.';
        next.disabled = false;
      });
    });

    // 영상 끝 → 검정 화면 유지
    video.addEventListener('ended', async () => {
      if (state !== 'video') return;
      state = 'end';
      await hide(s3, T.vidOut);
    });
  })();
</script>
